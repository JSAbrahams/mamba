name: Lint

on:
  push:
    branches: [ master, develop ]
  pull_request:
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    environment: development
    strategy:
      matrix:
        os: [ "ubuntu-latest" ]

    runs-on: ${{ matrix.os }}
    name: via ${{ matrix.os }}, Devbox

    steps:
      - uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: 'true'

      # `devbox run lint` is the same script contributors run locally: cargo fmt --check,
      # cargo clippy --all-features -D warnings, cargo sort --check, and actionlint over these
      # workflow files. Keeping CI on the script rather than on its own copy of the commands
      # means the two cannot drift apart.
      - name: Lint
        run: devbox run lint
