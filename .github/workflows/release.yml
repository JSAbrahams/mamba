name: Release

on:
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # The WebAssembly module of the playground: mamba.js, the glue for a plain <script> tag, and
  # mamba_bg.wasm, the compiler itself. Both are uploaded to the release, with their checksums.
  wasm:
    runs-on: ubuntu-latest
    name: WebAssembly module

    steps:
      # The tags are needed: build.rs takes the version from `git describe --tags`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: 'true'

      # The same script as locally: cargo, wasm-bindgen and wasm-opt, all pinned by devbox.lock.
      - name: Build the WebAssembly module
        run: devbox run build-wasm

      - name: Write checksums
        working-directory: target/wasm-pkg
        run: sha256sum mamba.js mamba_bg.wasm > SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: target/wasm-pkg
        run: gh release upload "$TAG" mamba.js mamba_bg.wasm SHA256SUMS --clobber
