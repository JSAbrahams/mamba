name: Coverage

on:
  push:
    branches: [ master, develop ]
  pull_request:
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    environment: development
    strategy:
      matrix:
        os: [ "ubuntu-latest" ]

    runs-on: ${{ matrix.os }}
    name: via ${{ matrix.os }}, Devbox

    steps:
      - uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: 'true'

      # `devbox run coverage` is the same script contributors run locally, and carries the
      # --ignore-filename-regex exclusions with it. Devbox supplies cargo-llvm-cov plus the
      # matching llvm-cov/llvm-profdata via LLVM_COV/LLVM_PROFDATA, so no rustup component or
      # `cargo install` step is needed.
      - name: Generate LCOV report
        run: devbox run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/lcov.info
          fail_ci_if_error: true
          token: ${{ vars.CODECOV_TOKEN }}
          slug: codecov/gh/JSAbrahams/mamba

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: ./target/lcov.info
